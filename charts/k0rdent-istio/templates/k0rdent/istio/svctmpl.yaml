{{- if .Values.isManagement }}
{{- $chartVersion := .Chart.Version | replace "." "-" }}
{{- /*
TODO: Add back the main template to the list after the new release
  (dict
    "name" (printf "%s-main-%s" .Chart.Name $chartVersion)
    "prefix" (printf "%s-main" .Chart.Name)
    "specType" "helm"
    "chart" .Chart.Name
    "version" .Chart.Version
    "repo" (index .Values "k0rdent-istio" "repo" "name")
  )
*/ -}}
{{- $templates := list
  (dict
    "name" (printf "%s-propagation-%s" .Chart.Name $chartVersion)
    "prefix" (printf "%s-propagation" .Chart.Name)
    "specType" "helm"
    "chart" (printf "%s-propagation" .Chart.Name)
    "version" .Chart.Version
    "repo" (index .Values "k0rdent-istio" "repo" "name")
  )
  (dict
    "name" (printf "%s-namespace-%s" .Chart.Name $chartVersion)
    "prefix" (printf "%s-namespace" .Chart.Name)
    "specType" "resources"
    "version" .Chart.Version
    "configMapName" (printf "%s-namespace-template" .Chart.Name)
  )
}}
{{- range $templateDef := $templates }}
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplate
metadata:
  name: {{ $templateDef.name }}
  namespace: {{ $.Values.kcm.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- if eq $templateDef.specType "helm" }}
  helm:
    chartSpec:
      chart: {{ $templateDef.chart }}
      version: {{ $templateDef.version | quote }}
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: {{ $templateDef.repo }}
  {{- else }}
  resources:
    localSourceRef:
      kind: ConfigMap
      name: {{ $templateDef.configMapName }}
      namespace: {{ $.Values.kcm.namespace }}
    deploymentType: Remote
    path: ""
  {{- end }}
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplateChain
metadata:
  name: {{ $templateDef.name }}
  namespace: {{ $.Values.kcm.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  supportedTemplates:
    - name: {{ $templateDef.name }}
    {{- range $template := (lookup "k0rdent.mirantis.com/v1beta1" "ServiceTemplate" $.Values.kcm.namespace "").items }}
      {{- $oldName := $template.metadata.name }}
      {{- if and ($oldName | hasPrefix $templateDef.prefix) (ne $oldName $templateDef.name) (or $template.spec.helm $template.spec.resources) }}
    - name: {{ $oldName }}
      availableUpgrades:
        - name: {{ $templateDef.name }}
          version: {{ $templateDef.version | quote }}
      {{- end }}
    {{- end }}
{{- end }}
---
# TODO: Delete this ServiceTemplate after the new release
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplate
metadata:
  name: {{ .Chart.Name }}-main-{{ $chartVersion }}
  namespace: {{ .Values.kcm.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  helm:
    chartSpec:
      chart: {{ .Chart.Name }}
      version: {{ .Chart.Version | quote }}
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: {{ index .Values "k0rdent-istio" "repo" "name" }}
---
# TODO: Delete this ServiceTemplateChain after the new release
{{- $template := lookup "k0rdent.mirantis.com/v1beta1" "ServiceTemplate" .Values.kcm.namespace (printf "%s-0-5-0" .Chart.Name) }}
{{- if $template }}
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplateChain
metadata:
  name: {{ .Chart.Name }}-main-{{ $chartVersion }}
  namespace: {{ .Values.kcm.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  supportedTemplates:
    - name: {{ .Chart.Name }}-main-{{ $chartVersion }}
    - name: {{ .Chart.Name }}-0-5-0
      availableUpgrades:
        - name: {{ .Chart.Name }}-main-{{ $chartVersion }}
          version: {{ .Chart.Version | quote }}
{{- end }}
{{- end }}