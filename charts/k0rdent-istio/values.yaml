kcm:
  # -- K8s namespace created on installation of k0rdent/kcm.
  namespace: kcm-system

# -- Enable management mode for this deployment
isManagement: true

# -- Configuration for the management cluster's participation in the Istio mesh
managementCluster:
  # -- When true, the management cluster is itself enrolled as a mesh member.
  # The operator will bootstrap Istio resources (remote secret, CA certificate,
  # and east-west gateway) for the management cluster in addition to child clusters.
  includeInMesh: false

  # -- Unique cluster name for the management cluster.
  # Used in certificate and remote secret generation.
  name: management

  # -- Externally accessible URL of the management cluster Kubernetes API server.
  # Required when includeInMesh is true and the operator runs in-cluster, so that Istiod on
  # member clusters can reach the management cluster API server (e.g. "https://1.2.3.4:6443").
  apiServer: "https://kcm-dev-control-plane:6443"

cert-manager:
  # -- ServiceTemplate name
  template: cert-manager-v1-19-3

global:
  # -- Address of the Istio CSR service provided by cert-manager
  caAddress: cert-manager-istio-csr.istio-system.svc:443

  # -- Unique mesh ID shared across clusters in the same mesh
  meshID: main

  # -- Enables use of an external Istiod control plane
  externalIstiod: true

  multiCluster:
    # -- Name of this cluster within the multi-cluster mesh
    clusterName: management

  # -- Logical network name for this cluster (used by Istio for multi-network setups)
  network: management-network

  meshConfig:
    # -- Path where Envoy access logs will be written
    accessLogFile: /dev/stdout

telemetry:
  # -- Enable Istio telemetry with OpenTelemetry tracing
  enabled: true
  # -- Percentage of requests to sample for tracing (0–100)
  traces_sampling_percentage: 100

rootCA:
  # -- Enable creation of the root certificate authority
  enabled: true

intermediateCA:
  # -- Whether to issue an intermediate CA certificate
  certificate: true

  # -- Whether to create an Issuer resource for this intermediate CA
  issuer: true

certManagerIstioCsr:
  # -- Enable installation of cert-manager-istio-csr. Set to false if it is already installed in the cluster.
  enabled: true

cert-manager-istio-csr:
  app:
    tls:
      # -- DNS names for the cert-manager Istio CSR service
      certificateDNSNames:
        - cert-manager-istio-csr.istio-system.svc
    certmanager:
      issuer:
        # -- Reference to the cert-manager Issuer for Istio certificates.
        # For management, the chart creates a stable issuer (istio-ca-issuer-management) with associated resources.
        # For child clusters, the issuer name suffix is derived from cluster namespace and name via adler32sum (in MCS). The istio-operator takes care of creating and propagating the associated resources.
        name: istio-ca-issuer-management
        kind: Issuer
        group: cert-manager.io
    server:
      # -- Cluster ID used by the cert-manager Istio CSR server
      clusterID: management
      caTrustedNodeAccounts: istio-system/ztunnel

istiobase:
  # -- Enable installation of istio-base. Set to false if it is already installed in the cluster.
  enabled: true

istiod:
  # -- Enable installation of istiod. Set to false if it is already installed in the cluster.
  enabled: true
  # -- Use Istio ambient profile for control plane defaults
  profile: ambient

  # -- Mount and reference cert-manager issued TLS and CA certificates
  extraContainerArgs:
    - --tlsCertFile=/etc/cert-manager/tls/tls.crt
    - --tlsKeyFile=/etc/cert-manager/tls/tls.key
    - --caCertFile=/etc/cert-manager/ca/root-cert.pem

  volumeMounts:
    - mountPath: /etc/cert-manager/tls
      name: cert-manager
      readOnly: true
    - mountPath: /etc/cert-manager/ca
      name: ca-root-cert
      readOnly: true
  volumes:
    - name: cert-manager
      secret:
        defaultMode: 420
        secretName: istiod-tls
    - name: ca-root-cert
      configMap:
        defaultMode: 420
        name: istio-ca-root-cert
        optional: true

  meshConfig:
    # -- Enables tracing collection inside the Istio mesh
    enableTracing: true

    # -- Custom extension providers for telemetry (empty by default)
    extensionProviders: []
    defaultConfig:
      proxyMetadata:
        # -- Enables DNS capture for Istio sidecar proxies
        ISTIO_META_DNS_CAPTURE: "true"

  pilot:
    env:
      PILOT_ENABLE_IP_AUTOALLOCATE: "true"
      ENABLE_WILDCARD_HOST_SERVICE_ENTRIES_FOR_TLS: "true"
      # Necessary for Waypoint routing to work with Ingress Gateway
      ENABLE_INGRESS_WAYPOINT_ROUTING: "true"
      # Necessary for GAIE to work
      ENABLE_GATEWAY_API_INFERENCE_EXTENSION: "true"
      # Watch and reconcile experimental (v1alpha2) Gateway API resources.
      # The workspace SSH/TCP port pool uses TCPRoute, which istiod ignores
      # unless this gate is on (HTTPRoute is stable and works without it).
      PILOT_ENABLE_ALPHA_GATEWAY_API: "true"

  env:
    # -- Disables Istiod CA server when external cert-manager CA is used
    ENABLE_CA_SERVER: false
    # -- Enables ambient multicluster multi-network processing in istiod
    AMBIENT_ENABLE_MULTI_NETWORK: "true"
    AMBIENT_ENABLE_MULTI_NETWORK_INGRESS: "true"
    AMBIENT_ENABLE_MULTI_NETWORK_WAYPOINT: "true"
    AMBIENT_ENABLE_BAGGAGE: "true"

cni:
  # -- Use Istio ambient profile for CNI daemonset defaults
  profile: ambient

ztunnel:
  profile: ambient

operator:
  # -- Enables the `istio-operator`.
  enabled: true

  # -- Number of the `istio-operator` deployment replicas.
  replicaCount: 1

  rbac:
    # -- Creates the `k0rdent-istio-operator` cluster role
    # and binds it to the service account of operator.
    create: true

  # -- Image of the istio operator.
  image:
    registry: ghcr.io/exalsius
    repository: k0rdent-istio/istio-operator-controller
    pullPolicy: Always

  resources:
    # -- Minimum resources required for operator.
    requests:
      cpu: 100m
      memory: 128Mi

    # -- Maximum resources available for operator.
    limits:
      cpu: 100m
      memory: 128Mi

  serviceAccount:
    # -- Creates a service account for operator.
    create: true

    # -- Annotations for the service account of operator.
    annotations: {}

    # -- Name for the service account of operator.
    # If not set, it is generated as `k0rdent-istio-operator`.
    name: ""

istio:
  # -- Repo of upstream Istio helm charts (for gateway, etc.).
  repo:
    name: istio
    spec:
      interval: 10m
      url: https://istio-release.storage.googleapis.com/charts

k0rdent-istio:
  # -- Repo of `istio-*` helm charts.
  repo:
    name: istio-registry
    spec:
      type: oci
      url: oci://ghcr.io/exalsius/k0rdent-istio/charts
      insecure: false

# -- Config of `ServiceTemplate` to use `cert-manager` in `MultiClusterService`.
cert-manager-service-template:
  enabled: true
  repo:
    name: cert-manager
    spec:
      url: oci://quay.io/jetstack/charts
  chart: cert-manager:v1.19.3
  namespace: kcm-system
