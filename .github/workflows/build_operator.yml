name: "Build and push operator"

on:
  push:
    branches:
      - v0.4.0-mod
    paths:
      - "istio-operator/**"

jobs:
  build:
    concurrency:
      group: build-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    name: Build and Unit Test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "istio-operator/go.mod"
          cache: false
      - name: Unit tests
        working-directory: ./istio-operator
        run: |
          make test
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute branch image tag
        id: branch-tag
        shell: bash
        run: |
          # github.ref_name is the branch or tag name that triggered the workflow
          ref_name="${GITHUB_REF_NAME}"
          # Docker tag rules are stricter than git refs; normalize to a safe tag.
          tag="$(echo "${ref_name}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
          # Fallback just in case normalization produces empty string
          if [[ -z "${tag}" ]]; then
            tag="unknown-branch"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Compute Lowercase Repo
        id: compute-repo
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=$repo_lower" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ghcr.io/${{ steps.compute-repo.outputs.repo_lower }}/istio-operator-controller
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ steps.branch-tag.outputs.tag }}
